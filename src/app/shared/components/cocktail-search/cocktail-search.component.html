<div class="row g-3 mt-2">
  <div class="col-md-3">
    <label for="searchTypeSelect" class="visually-hidden">Tipo de búsqueda</label>
    <select
      id="searchTypeSelect"
      class="form-select"
      [ngModel]="searchType"
      (ngModelChange)="onSearchTypeSelect($event)"
      aria-label="Seleccionar criterio de búsqueda"
    >
      <option value="name">Nombre (Máx 50 car.)</option>
      <option value="ingredient">Ingrediente</option>
      <option value="id">ID Numérico</option>
    </select>
  </div>
  <div class="col-md-6 position-relative">
    <label for="searchInput" class="visually-hidden">Término de búsqueda</label>
    <input
      id="searchInput"
      type="text"
      class="form-control pe-5"
      [ngModel]="searchTerm"
      (ngModelChange)="onInput($event)"
      [placeholder]="getPlaceholder()"
      [maxlength]="searchType === 'name' ? 50 : null"
      aria-label="Buscar cócteles por término"
    />
    <!-- Botón para limpiar de golpe -->
    @if (searchTerm) {
      <button
        type="button"
        class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 text-muted border-0 bg-transparent"
        (click)="onClear()"
        aria-label="Limpiar búsqueda"
      >
        ✕
      </button>
    }
  </div>
  <div class="col-md-3 d-flex align-items-center">
    <button
      type="button"
      class="btn w-100"
      [class.btn-warning]="showOnlyFavorites"
      [class.btn-outline-secondary]="!showOnlyFavorites"
      [attr.aria-pressed]="showOnlyFavorites"
      aria-label="Filtrar solo cócteles favoritos"
      (click)="onToggleFavorites()"
    >
      ★ Ver Favoritos
    </button>
  </div>
</div>
